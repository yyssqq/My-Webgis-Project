<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My WebGIS — AI 空间分析平台</title>
  <link rel="stylesheet" href="/node_modules/cesium/Build/Cesium/Widgets/widgets.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #0c1222;
      --bg-panel: #111827;
      --bg-card: #1a2235;
      --border: #1e2d45;
      --text: #c8d2dc;
      --text-dim: #6b7a8d;
      --accent: #4f8ef7;
      --accent-hover: #3b7ae5;
      --green: #2ecc71;
      --red: #e74c3c;
      --orange: #f39c12;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
      background: var(--bg-deep); color: var(--text); font-size: 13.5px;
    }

    /* ---- Top Bar ---- */
    #topbar {
      height: 42px; background: var(--bg-panel); display: flex; align-items: center;
      padding: 0 16px; border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px); z-index: 10;
    }
    #topbar .logo { font-weight: 700; font-size: 15px; color: #fff; letter-spacing: -0.3px; }
    #topbar .logo span { color: var(--accent); }
    #topbar .badge {
      font-size: 10px; background: var(--accent); color: #fff; padding: 2px 8px;
      border-radius: 10px; margin-left: 10px; font-weight: 600;
    }
    #topbar .status {
      margin-left: auto; display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-dim);
    }
    #topbar .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
    }
    #topbar .status-dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #topbar .status-dot.off { background: var(--red); }

    /* ---- Main Layout ---- */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ---- Left Panel ---- */
    #left {
      width: 252px; background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; padding: 14px;
      gap: 16px; font-size: 12.5px;
    }
    #left .section-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-dim); font-weight: 600; margin-bottom: -8px;
    }
    #left .tool-item {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px;
    }
    #left .tool-item .t-name { color: var(--accent); font-weight: 600; font-size: 13px; }
    #left .tool-item .t-desc { color: var(--text-dim); font-size: 11px; margin-top: 3px; }

    #left button {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg-card); color: var(--text); cursor: pointer; font-size: 12px;
      text-align: left; transition: all 0.15s; font-family: inherit;
    }
    #left button:hover { background: #1e3050; border-color: var(--accent); }
    #left button.accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
    #left button.accent:hover { background: var(--accent-hover); }
    #left button.danger:hover { background: #3d1515; border-color: var(--red); color: var(--red); }

    .layer-entry {
      font-size: 11px; color: var(--accent); padding: 3px 0;
      border-bottom: 1px solid var(--border);
    }

    /* ---- Center Globe ---- */
    #center { flex: 1; position: relative; background: #000; }
    #cesiumContainer { width: 100%; height: 100%; }

    /* ---- Right Chat ---- */
    #right {
      width: 380px; background: var(--bg-panel); border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    #chat-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      font-weight: 600; font-size: 13.5px; color: #fff;
    }
    #chat-messages {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      max-width: 88%; padding: 10px 14px; border-radius: 10px;
      font-size: 13px; line-height: 1.55; word-wrap: break-word;
      animation: fadeUp 0.2s ease-out;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
    .msg.assistant { align-self: flex-start; background: var(--bg-card); color: var(--text); border-bottom-left-radius: 3px; }
    .msg.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 11px; padding: 8px 12px; text-align: center; max-width: 100%; }
    .msg.loading { align-self: flex-start; color: var(--text-dim); font-size: 12px; padding: 8px 14px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:0.4;} 50%{opacity:1;} }

    /* ---- Chat Input ---- */
    #chat-input-wrap {
      padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px;
    }
    #chat-input-wrap textarea {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 10px 12px; font-size: 13px; resize: none; height: 52px;
      font-family: inherit; outline: none; transition: border-color 0.15s;
    }
    #chat-input-wrap textarea:focus { border-color: var(--accent); }
    #chat-input-wrap textarea::placeholder { color: var(--text-dim); }
    #chat-input-wrap button {
      width: 56px; background: var(--accent); border: none; border-radius: 8px;
      color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s;
      font-family: inherit;
    }
    #chat-input-wrap button:hover { background: var(--accent-hover); }
    #chat-input-wrap button:disabled { background: #2a3550; color: var(--text-dim); cursor: not-allowed; }

    /* ---- Bottom Bar ---- */
    #bottombar {
      height: 26px; background: var(--bg-panel); border-top: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 14px; color: var(--text-dim);
      font-size: 10.5px; gap: 18px;
    }
    #bottombar .coord { margin-left: auto; }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div id="topbar">
    <div class="logo">My<span>WebGIS</span></div>
    <div class="badge">3D Globe</div>
    <div class="status">
      <div class="status-dot off" id="topDot"></div>
      <span id="statusText">等待连接</span>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <!-- Left -->
    <div id="left">
      <div class="section-title">GIS 工具</div>
      <div id="toolList"></div>

      <div class="section-title">GeoServer</div>
      <button id="btnWMS" onclick="toggleWMS()">加载 GeoServer WMS</button>
      <div id="wmsStatus" style="font-size:10px;color:var(--text-dim);margin-top:2px;"></div>

      <div class="section-title">快捷分析</div>
      <button class="accent" onclick="quickAnalyze()">天安门 5km 缓冲区</button>
      <button onclick="quickAnalyze2()">北京 → 上海距离</button>
      <button class="danger" onclick="clearGlobe()">清除结果</button>

      <div class="section-title">图层</div>
      <div id="layerList" style="color:var(--text-dim);font-size:11px;">暂无分析结果</div>
    </div>

    <!-- Center Globe -->
    <div id="center">
      <div id="cesiumContainer"></div>
    </div>

    <!-- Right Chat -->
    <div id="right">
      <div id="chat-header">AI 空间分析助手</div>
      <div id="chat-messages">
        <div class="msg system">
          欢迎使用 MyWebGIS 🌍<br>
          用自然语言描述分析需求，AI 自动执行 GIS 分析并渲染到球体上。<br><br>
          试试："分析大理古城周边10公里"
        </div>
      </div>
      <div id="chat-input-wrap">
        <textarea id="chatInput" placeholder="输入分析需求，Enter 发送..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div id="bottombar">
    <span>GeoServer :8080</span>
    <span>Backend :3000</span>
    <span class="coord" id="coordInfo">鼠标坐标 -</span>
  </div>

  <script>
    window.CESIUM_BASE_URL = "/node_modules/cesium/Build/Cesium/";
  </script>
  <script src="/node_modules/cesium/Build/Cesium/Cesium.js"></script>
  <script>
    // ===== 1. Cesium Globe =====
    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: false,
    });
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(116.4, 28, 10000000),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
    });

    // ===== 2. Click & Mouse Tracking =====
    const clickHandler = new Cesium.ScreenSpaceEventHandler(viewer.canvas);
    clickHandler.setInputAction((click) => {
      const cartesian = viewer.scene.pickPosition(click.position);
      if (!cartesian) return;
      const c = Cesium.Cartographic.fromCartesian(cartesian);
      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(Cesium.Math.toDegrees(c.longitude), Cesium.Math.toDegrees(c.latitude)),
        point: { pixelSize: 8, color: Cesium.Color.fromCssColorString("#4f8ef7"), outlineColor: Cesium.Color.WHITE, outlineWidth: 1.5 },
      });
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    viewer.scene.canvas.addEventListener("mousemove", (e) => {
      const rect = viewer.scene.canvas.getBoundingClientRect();
      const cartesian = viewer.scene.pickPosition(new Cesium.Cartesian2(e.clientX - rect.left, e.clientY - rect.top));
      if (cartesian) {
        const c = Cesium.Cartographic.fromCartesian(cartesian);
        document.getElementById("coordInfo").textContent =
          `鼠标: ${Cesium.Math.toDegrees(c.longitude).toFixed(4)}, ${Cesium.Math.toDegrees(c.latitude).toFixed(4)}`;
      }
    });

    // ===== 3. GeoServer WMS =====
    let wmsVisible = false;
    let wmsLayer;
    function toggleWMS() {
      if (!wmsLayer) {
        wmsLayer = viewer.imageryLayers.addImageryProvider(
          new Cesium.WebMapServiceImageryProvider({
            url: "http://localhost:8080/geoserver/topp/wms",
            layers: "topp:states",
            parameters: { transparent: true, format: "image/png" },
          })
        );
      }
      wmsVisible = !wmsVisible;
      wmsLayer.show = wmsVisible;
      document.getElementById("btnWMS").textContent = wmsVisible ? "隐藏 GeoServer WMS" : "加载 GeoServer WMS";
      document.getElementById("wmsStatus").textContent = wmsVisible ? "topp:states (美国各州)" : "";
    }

    // ===== 4. GeoJSON → Globe =====
    const resultDS = [];
    function renderToGlobe(tool, result) {
      if (!result?.geojson) return;
      const fc = result.geojson.type === "FeatureCollection" ? result.geojson : { type: "FeatureCollection", features: [result.geojson] };
      const ds = new Cesium.GeoJsonDataSource();
      const color = tool === "buffer" ? Cesium.Color.fromCssColorString("#e74c3c").withAlpha(0.25) : Cesium.Color.fromCssColorString("#2ecc71").withAlpha(0.4);
      ds.load(fc, {
        stroke: tool === "buffer" ? Cesium.Color.fromCssColorString("#e74c3c") : Cesium.Color.fromCssColorString("#2ecc71"),
        fill: color,
        strokeWidth: 2.5,
      }).then(() => {
        viewer.dataSources.add(ds);
        resultDS.push(ds);
        viewer.flyTo(ds, { duration: 1.2 });
      });
    }
    function updateLayerList(tool, result) {
      document.getElementById("layerList").innerHTML +=
        `<div class="layer-entry">▲ ${tool}: ${(result.summary||'').slice(0,45)}</div>`;
    }
    function clearGlobe() {
      viewer.entities.removeAll();
      resultDS.forEach(d => viewer.dataSources.remove(d));
      resultDS.length = 0;
      document.getElementById("layerList").innerHTML = "暂无分析结果";
    }

    // ===== 5. Chat Logic =====
    let history = [];
    function addMsg(role, text) {
      const d = document.createElement("div");
      d.className = `msg ${role}`;
      d.innerHTML = text.replace(/\n/g, "<br>");
      const el = document.getElementById("chat-messages");
      el.appendChild(d);
      el.scrollTop = el.scrollHeight;
    }
    function setLoading(v) {
      document.getElementById("sendBtn").disabled = v;
      document.getElementById("chatInput").disabled = v;
      if (v) addMsg("loading", "AI 正在思考...");
      else document.querySelectorAll(".msg.loading").forEach(l => l.remove());
    }
    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMsg("user", text);
      setLoading(true);
      try {
        const res = await fetch("http://localhost:3000/api/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });
        const data = await res.json();
        setLoading(false);
        if (data.error) { addMsg("assistant", "❌ " + data.error); return; }
        addMsg("assistant", data.reply);
        history = data.messages || history;
        (data.toolCalls || []).forEach(({ tool, result }) => {
          renderToGlobe(tool, result);
          updateLayerList(tool, result);
        });
      } catch (err) {
        setLoading(false);
        addMsg("assistant", "❌ 连接失败，请确认后端已启动");
      }
    }
    function quickAnalyze() { document.getElementById("chatInput").value = "分析北京天安门周边5公里"; sendMessage(); }
    function quickAnalyze2() { document.getElementById("chatInput").value = "计算北京天安门到上海外滩的直线距离"; sendMessage(); }

    // ===== 6. WebSocket =====
    let ws;
    function connectWS() {
      ws = new WebSocket("ws://localhost:3000");
      ws.onopen = () => { document.getElementById("topDot").className = "status-dot on"; document.getElementById("statusText").textContent = "WebSocket 已连接"; };
      ws.onmessage = (e) => {
        try {
          const m = JSON.parse(e.data);
          if (m.type === "tool_result") { renderToGlobe(m.tool, m.result); updateLayerList(m.tool, m.result); }
        } catch {}
      };
      ws.onclose = () => { document.getElementById("topDot").className = "status-dot off"; document.getElementById("statusText").textContent = "重连中..."; setTimeout(connectWS, 3000); };
      ws.onerror = () => { document.getElementById("topDot").className = "status-dot off"; document.getElementById("statusText").textContent = "WebSocket 失败"; };
    }

    // ===== 7. Load Tools =====
    async function loadTools() {
      try {
        const res = await fetch("http://localhost:3000/api/tools");
        const data = await res.json();
        document.getElementById("toolList").innerHTML = data.tools.map(t =>
          `<div class="tool-item"><div class="t-name">${t.name}</div><div class="t-desc">${t.description}</div></div>`
        ).join("");
      } catch { document.getElementById("toolList").innerHTML = "<span style='color:var(--text-dim)'>后端未连接</span>"; }
    }

    // ===== Boot =====
    loadTools();
    connectWS();
  </script>
</body>
</html>
