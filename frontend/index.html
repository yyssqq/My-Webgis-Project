<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My WebGIS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10/ol.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #map {
      width: 100vw;
      height: 100vh;
    }

    /* 状态栏：固定在左下角，显示后端连接情况 */
    #status {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #0f0;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      z-index: 1000;
      max-width: 360px;
    }

    /* 连接状态指示灯 */
    #status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .dot.on  { background: #0f0; }
    .dot.off { background: #f00; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- 状态栏 -->
  <div id="status">
    <span class="dot off" id="dot"></span>
    <span id="statusText">正在连接后端...</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@10/dist/ol.js"></script>
  <script>
    // ===== 1. 地图初始化（阶段 3 的代码） =====

    const map = new ol.Map({
      target: "map",
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([116.4, 39.9]),
        zoom: 5
      })
    });

    // ===== 2. 点击标记图层 =====

    // 创建一个矢量图层，用来存放用户点击后的标记点
    const markerSource = new ol.source.Vector();
    const markerLayer = new ol.layer.Vector({
      source: markerSource,
      style: new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color: "#ff4444" }),
          stroke: new ol.style.Stroke({ color: "#fff", width: 2 })
        })
      })
    });
    map.addLayer(markerLayer);

    // ===== 3. 点击地图 =====

    map.on("click", (evt) => {
      // evt.coordinate 是 Web 墨卡托坐标，转成经纬度
      const [lng, lat] = ol.proj.toLonLat(evt.coordinate);
      console.log(`点击坐标: 经度=${lng.toFixed(4)}, 纬度=${lat.toFixed(4)}`);

      // 方式一：通过 HTTP POST 发给后端
      fetch("http://localhost:3000/api/click", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lng, lat })
      })
        .then((res) => res.json())
        .then((data) => {
          console.log("HTTP 响应:", data);
          setStatus(true, `点击已提交 (第 ${data.totalClicks} 次)`);
        })
        .catch((err) => {
          console.error("HTTP 请求失败:", err);
          setStatus(false, "后端未连接，请先启动 node server.js");
        });

      // 方式二：通过 WebSocket 发给后端
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "click", lng, lat }));
      }
    });

    // ===== 4. WebSocket 连接 =====

    let ws = null;

    function connectWebSocket() {
      ws = new WebSocket("ws://localhost:3000");

      // 连接成功
      ws.onopen = () => {
        console.log("WebSocket 连接成功");
        setStatus(true, "WebSocket 已连接");

        // 把之前收到的点击历史补画出来
        markerSource.clear();
        ws._history?.forEach(({ lng, lat }) => {
          addMarker(lng, lat);
        });
      };

      // 收到消息
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          console.log("WebSocket 收到:", msg);

          if (msg.type === "welcome") {
            // 保存历史记录，等连接建立后用
            ws._history = msg.history;
            setStatus(true, msg.message);
          }

          if (msg.type === "click") {
            addMarker(msg.lng, msg.lat);
            setStatus(true, `收到点击 (共 ${msg.totalClicks} 次)`);
          }
        } catch {
          console.log("收到文本:", event.data);
        }
      };

      // 断开时自动重连
      ws.onclose = () => {
        console.log("WebSocket 断开，3 秒后重连...");
        setStatus(false, "连接断开，尝试重连...");
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => {
        setStatus(false, "连接失败，请确认后端已启动");
      };
    }

    // ===== 5. 辅助函数 =====

    // 在地图上添加标记
    function addMarker(lng, lat) {
      const point = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([lng, lat]))
      });
      markerSource.addFeature(point);
    }

    // 更新状态栏
    function setStatus(connected, text) {
      document.getElementById("dot").className = "dot " + (connected ? "on" : "off");
      document.getElementById("statusText").textContent = text;
    }

    // ===== 启动 WebSocket =====
    connectWebSocket();
  </script>
</body>
</html>
